site_name: ExBook
site_description: 面向中文考试教育的 LaTeX 文档类系列 — 考试刷题册、书籍排版、英语手译本，用简单的命令生成专业排版的 PDF
site_url: https://exbook.github.io/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/images/favicon.png
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
    annotation: material/arrow-right-circle
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tabs
    - navigation.tabs.sticky
    - search.suggest
    - search.highlight
    - search.share
    - announce.dismiss
    - content.action.edit
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
      media: "(prefers-color-scheme: light)"
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式
      media: "(prefers-color-scheme: dark)"
  custom_dir: overrides
  language: zh
  font:
    text: Inter
    code: JetBrains Mono

nav:
  - 首页: index.md
  - ExBookie 刷题册: exbook.md
  - TransBook 手译本: transbook.md
  - ExPress 书籍排版: express.md

repo_url: https://github.com/ExBook
repo_name: ExBook
edit_uri: ExBook.github.io/blob/main/docs/

plugins:
  - search
  - blog:
      archive_date_format: MMMM yyyy

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ExBook
      name: GitHub
  generator: false

extra_css:
  - stylesheets/extra.css
  - stylesheets/landing.css

copyright: Copyright &copy; 2024 - 2026 ExBook
