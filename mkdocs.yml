site_name: ExBook Project
site_description: LaTeX document classes — exam prep books, textbooks, and translation practice
site_url: https://exbook.github.io/
theme:
  name: material
  
  logo: assets/logo.png
  favicon: assets/images/favicon.png
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil 
    view: material/eye
    annotation: material/arrow-right-circle
  features:
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    # - header.autohide
    - announce.dismiss
    # - navigation.tabs
    - navigation.footer
    - content.action.edit
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default 
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
      primary: indigo
      accent: indigo
  language: zh
nav:
  - 首页: index.md
  - ExBook 刷题册: exbook.md
  - ExPress 书籍排版: express.md
  - TransBook 手译本: transbook.md

repo_url: https://github.com/ExBook
repo_name: ExBook Project
edit_uri: ExBook.github.io/blob/main/docs/


plugins:
  - search
  - blog:
      archive_date_format: MMMM yyyy
  # - social

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
      
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ExBook
      name: GitHub
  generator: false

copyright: Copyright &copy; 2024 - 2026 ExBook Project 